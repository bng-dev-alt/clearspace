# Slack app for the RUN 05 PERSONAL notifications (direct messages to the user who connects). Local live acceptance: redirect on loopback.
display_information:
  name: ClearSpace oznámení (dev)
features:
  bot_user:
    display_name: ClearSpace
    always_online: false
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true
oauth_config:
  redirect_urls:
    - https://localhost:3472/api/notify/slack/callback
  scopes:
    bot:
      - chat:write
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
