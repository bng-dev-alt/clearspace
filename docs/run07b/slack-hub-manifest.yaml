# Slack app "ClearSpace Projekty" (Communication Hub). <BASE> = public HTTPS base of the webhooks (hub-live.sh fills in the tunnel URL;
# the OAuth redirect stays on https://localhost:3472 for local live acceptance, or the app domain in production).
display_information:
  name: ClearSpace Projekty (dev)
  description: Propojení projektů ClearSpace s vybranými kanály
features:
  bot_user:
    display_name: ClearSpace Projekty
    always_online: false
  slash_commands:
    - command: /clearspace
      url: https://<BASE>/api/hub/slack/commands
      description: Propojení kanálu a účtu s ClearSpace
      usage_hint: propojit KÓD | ucet KÓD | stav
      should_escape: false
  shortcuts:
    - name: Vytvořit úkol v ClearSpace
      type: message
      callback_id: clearspace_create_task
      description: Vytvoří úkol z této zprávy
oauth_config:
  redirect_urls:
    - https://<BASE>/api/hub/slack/install/callback
  scopes:
    bot:
      - chat:write
      - commands
      - channels:history
      - groups:history
settings:
  event_subscriptions:
    request_url: https://<BASE>/api/hub/slack/events
    bot_events:
      - message.channels
      - message.groups
      - app_uninstalled
      - tokens_revoked
  interactivity:
    is_enabled: true
    request_url: https://<BASE>/api/hub/slack/interactivity
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
